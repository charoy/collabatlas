- id: howison-2014
  title: 'Collaboration Through Open Superposition: A Theory of the Open Source Way1'
  authors: James Howison, Kevin Crowston
  journal: MIS Quarterly
  year: 2014
  doi: 10.25300/misq/2014/38.1.02
  url: https://doi.org/10.25300/misq/2014/38.1.02
  access: paid
  abstract: 'This paper develops and illustrates the theory of collaboration through
    open superposition: the process of depositing motivationally independent layers
    of work on top of each other over time. The theory is developed in a study of
    community-based free and open source software (FLOSS) development, through a research
    arc of discovery (participant observation), replication (two archival case studies),
    and theorization. The theory explains two key findings: (1) the overwhelming majority
    of work is accomplished with only a single programmer working on any one task,
    and (2) tasks that appear too large for any one individual are more likely to
    be deferred until they are easier rather than being undertaken through structured
    team work. Moreover, the theory explains how working through open superposition
    can lead to the discovery of a work breakdown that results in complex, functionally
    interdependent, work being accomplished without crippling search costs. We identify
    a set of socio-technical contingencies under which collaboration through open
    superposition is likely to be effective, including characteristics of artifacts
    made from information as the objects being worked on. We demonstrate the usefulness
    of the theory by using it to analyze difficulties in learning from FLOSS in other
    domains of work and in the IS function of for-profit organizations.'
  citation_count: 158
