- id: olson-2000
  title: Distance Matters
  authors: Gary M. Olson, Judith S. Olson
  journal: Human-Computer Interaction
  year: 2000
  doi: 10.1207/s15327051hci1523_4
  url: https://doi.org/10.1207/s15327051hci1523_4
  access: paid
  abstract: 'Giant strides in information technology at the turn of the century may
    have unleashed unreachable goals. With the invention of groupware, people expect
    to communicate easily with each other and accomplish difficult work even though
    they are remotely located or rarely overlap in time. Major corporations launch
    global teams, expecting that technology will make "virtual collocation" possible.
    Federal research money encourages global science through the establishment of
    "collaboratories. " We review over 10 years of field and laboratory investigations
    of collocated and noncollocated synchronous group collaborations. In particular,
    we compare collocated work with remote work as it is possible today and comment
    on the promise of remote work tomorrow. We focus on the sociotechnical conditions
    required for effective distance work and bring together the results with four
    key concepts: common ground, coupling of work, collaboration readiness, and collaboration
    technology readiness. Groups with high common ground and loosely coupled work,
    with readiness both for collaboration and collaboration technology, have a chance
    at succeeding with remote work. Deviations from each of these create strain on
    the relationships among teammates and require changes in the work or processes
    of collaboration to succeed. Often they do not succeed because distance still
    matters.'
  citation_count: 1892
  openalex_id: https://openalex.org/W2911311425
- id: kittur-2013
  title: The future of crowd work
  authors: Aniket Kittur, Jeffrey V. Nickerson, Michael S. Bernstein, Elizabeth M.
    Gerber, Aaron Shaw, John Zimmerman, Matthew Lease, John J. Horton
  journal: Proceedings of the ACM Conference on CSCW
  year: 2013
  doi: 10.1145/2441776.2441923
  url: https://doi.org/10.1145/2441776.2441923
  access: paid
  abstract: 'Paid crowd work offers remarkable opportunities for improving productivity,
    social mobility, and the global economy by engaging a geographically distributed
    workforce to complete complex tasks on demand and at scale. But it is also possible
    that crowd work will fail to achieve its potential, focusing on assembly-line
    piecework. Can we foresee a future crowd workplace in which we would want our
    children to participate? This paper frames the major challenges that stand in
    the way of this goal. Drawing on theory from organizational behavior and distributed
    computing, as well as direct feedback from workers, we outline a framework that
    will enable crowd work that is complex, collaborative, and sustainable. The framework
    lays out research challenges in twelve major areas: workflow, task assignment,
    hierarchy, real-time response, synchronous collaboration, quality control, crowds
    guiding AIs, AIs guiding crowds, platforms, job design, reputation, and motivation.'
  citation_count: 15
