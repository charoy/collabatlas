- id: dabbish-2012
  title: Social coding in GitHub
  authors: Laura Dabbish, Colleen Stuart, Jason Tsay, Jim Herbsleb
  journal: Proceedings of the ACM Conference on CSCW
  year: 2012
  doi: 10.1145/2145204.2145396
  url: https://doi.org/10.1145/2145204.2145396
  access: paid
  abstract: Social applications on the web let users track and follow the activities
    of a large number of others regardless of location or affiliation. There is a
    potential for this transparency to radically improve collaboration and learning
    in complex knowledge-based activities. Based on a series of in-depth interviews
    with central and peripheral GitHub users, we examined the value of transparency
    for large-scale distributed collaborations and communities of practice. We find
    that people make a surprisingly rich set of social inferences from the networked
    activity information in GitHub, such as inferring someone else's technical goals
    and vision when they edit code, or guessing which of several similar projects
    has the best chance of thriving in the long term. Users combine these inferences
    into effective strategies for coordinating work, advancing technical skills and
    managing their reputation.
