id: open-innovation
type: framework
title: Open Innovation
tagline: A distributed innovation model where organizations use external knowledge flows alongside internal R&D.
description: >-
  Open Innovation, coined by Henry Chesbrough in 2003, is a paradigm that assumes
  firms can and should use external ideas as well as internal ideas, and internal
  and external paths to market, as they advance their technology. It contrasts with
  the traditional closed innovation model where R&D is conducted entirely in-house.
  Open Innovation encompasses practices such as technology licensing, spin-offs,
  corporate venturing, crowdsourcing, and open-source collaboration. It is widely
  applied in technology industries, pharmaceuticals, and public sector innovation.
