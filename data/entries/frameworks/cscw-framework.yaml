id: cscw-framework
type: framework
title: Computer-Supported Cooperative Work (CSCW)
tagline: A research field and design framework examining how technology supports group work and collaboration.
description: >-
  Computer-Supported Cooperative Work (CSCW) is both a research field and a design
  framework concerned with understanding how people work together and how technology
  can support collaborative activities. The field draws on sociology, organizational
  theory, HCI, and systems design. Key analytical tools include the time-space matrix
  (same/different time and place), awareness mechanisms, and articulation work.
  CSCW research informs the design of groupware, collaborative platforms, and
  sociotechnical systems across domains from healthcare to software engineering.
