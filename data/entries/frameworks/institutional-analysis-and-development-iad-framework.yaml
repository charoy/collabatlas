title: Institutional Analysis and Development (IAD) Framework
tagline: Framework for analyzing collective action and governance in collaborative institutions and resource management systems.
description: The Institutional Analysis and Development (IAD) Framework, developed by Elinor Ostrom and colleagues, provides
  a systematic approach to understanding how institutions shape collaborative behavior and collective action. It examines
  the rules, norms, and shared strategies that govern how groups work together to solve common problems, particularly in resource
  management and public goods provision. The framework has been widely applied to analyze everything from community-based
  natural resource management to digital commons governance, making it essential for understanding the institutional foundations
  of successful collaboration.
