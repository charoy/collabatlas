id: situated-learning-theory
type: framework
title: Situated Learning Theory
tagline: Framework emphasizing learning through authentic participation in communities of practice and collaborative contexts.
description: Situated Learning Theory, developed by Jean Lave and Etienne Wenger, posits that learning is fundamentally a
  social process that occurs through legitimate peripheral participation in communities of practice. The framework emphasizes
  that knowledge is constructed through collaborative engagement in authentic activities rather than through isolated individual
  study. This theory has profound implications for understanding how collaboration facilitates knowledge transfer, skill development,
  and innovation across various domains from education to organizational learning.
