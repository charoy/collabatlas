description: 'The Collective Impact Framework is a structured approach developed by FSG that brings together organizations
  from different sectors to tackle complex social problems that cannot be solved by any single organization alone. It requires
  five key conditions: a common agenda, shared measurement systems, mutually reinforcing activities, continuous communication,
  and backbone support organizations. This framework has been widely adopted in initiatives addressing education reform, public
  health challenges, environmental issues, and community development projects worldwide.'
