title: Cultural-Historical Activity Theory (CHAT)
tagline: Expanded activity theory framework analyzing collaborative work through cultural, historical, and social contexts.
description: Cultural-Historical Activity Theory (CHAT) extends Activity Theory by emphasizing how collaborative activities
  are shaped by cultural tools, historical development, and social mediation. It provides a comprehensive framework for understanding
  how teams and communities engage in collective practices, focusing on contradictions, expansive learning, and the evolution
  of collaborative systems over time. CHAT is widely used to analyze workplace collaboration, educational partnerships, and
  community-based initiatives.
