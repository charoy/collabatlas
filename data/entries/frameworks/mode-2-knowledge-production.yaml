description: Mode 2 Knowledge Production describes a shift from traditional disciplinary research (Mode 1) to transdisciplinary,
  problem-oriented knowledge creation that occurs in real-world contexts. Characterized by heterogeneous teams, accountability
  to multiple stakeholders, and quality control through social validation rather than peer review alone. This framework emphasizes
  collaborative knowledge production that crosses institutional boundaries and directly addresses societal challenges through
  participatory approaches.
