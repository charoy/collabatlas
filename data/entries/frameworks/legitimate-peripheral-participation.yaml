id: legitimate-peripheral-participation
type: framework
title: Legitimate Peripheral Participation
tagline: Framework describing how newcomers gradually become full participants in communities of practice through collaborative
  learning
description: Legitimate Peripheral Participation (LPP) is a theoretical framework developed by Jean Lave and Etienne Wenger
  that explains how learning occurs through participation in collaborative communities. The framework describes how newcomers
  start at the periphery of a community and gradually move toward full participation through engagement in authentic activities.
  LPP emphasizes that learning is inherently social and collaborative, occurring through interactions with more experienced
  community members and meaningful participation in shared practices.
