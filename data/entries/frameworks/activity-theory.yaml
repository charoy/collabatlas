id: activity-theory
type: framework
title: Activity Theory
tagline: A conceptual framework for analyzing human activities as socially situated, tool-mediated, and goal-directed systems.
description: Activity Theory (AT) is a psychological and philosophical framework originating from the work of Vygotsky, Leont'ev,
  and later Engeström. It conceptualizes human activity as a hierarchical system composed of activities (driven by motives),
  actions (directed at goals), and operations (automated routines). Engeström's third-generation AT introduces the concept
  of an activity system — a collective unit of analysis comprising subject, object, tools, rules, community, and division
  of labor. AT is widely used in CSCW, HCI, organizational learning, and educational research to analyze collaborative work
  practices and contradictions within systems.
