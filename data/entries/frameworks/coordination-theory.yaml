id: coordination-theory
type: framework
title: Coordination Theory
tagline: Theoretical framework for understanding how multiple actors manage interdependencies in collaborative work.
description: Coordination Theory provides a systematic approach to understanding how individuals, teams, and organizations
  manage dependencies and coordinate their activities to achieve common goals. Developed by Thomas Malone and Kevin Crowston,
  this framework identifies different types of dependencies (shared resources, producer-consumer relationships, simultaneity
  constraints) and coordination mechanisms to manage them. It has been foundational in CSCW research and organizational design,
  helping explain how technology can support coordination in distributed and complex collaborative environments.
