id: transactive-memory-systems-tms
type: framework
title: Transactive Memory Systems (TMS)
tagline: Framework for understanding how teams collectively encode, store, and retrieve knowledge through specialized expertise
  and shared awareness.
description: 'Transactive Memory Systems theory explains how collaborative groups develop and maintain shared knowledge systems
  where members specialize in different domains and rely on each other''s expertise. The framework describes three key processes:
  specialization (who knows what), credibility (who to trust for information), and coordination (how to access and combine
  knowledge). TMS is fundamental for understanding how teams leverage distributed expertise, coordinate complex tasks, and
  maintain institutional memory across time and personnel changes.'
