id: actor-network-theory
type: framework
title: Actor-Network Theory
tagline: Framework that treats human and non-human actors symmetrically in analyzing socio-technical networks.
description: Actor-Network Theory (ANT) is a theoretical and methodological framework developed primarily by Bruno Latour,
  Michel Callon, and John Law that analyzes the relationships between human and non-human entities (actants) within heterogeneous
  networks. ANT rejects the distinction between the social and the technical, instead treating all actors — whether people,
  technologies, organizations, or natural phenomena — as equally capable of exerting agency within a network. The framework
  traces how networks are built, maintained, and transformed through processes of translation, and has been influential in
  science and technology studies, information systems research, organizational studies, and design.
