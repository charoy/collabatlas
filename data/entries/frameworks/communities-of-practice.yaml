id: communities-of-practice
type: framework
title: Communities of Practice
tagline: Framework for understanding how groups with shared concerns develop knowledge through regular interaction.
description: 'Communities of Practice (CoP) is a social learning framework developed by Etienne Wenger and Jean Lave that
  describes how groups of people who share a concern or passion for something learn to do it better through regular interaction.
  The framework identifies three essential dimensions of a community of practice: a shared domain of interest, the community
  itself as a social structure for learning, and the shared practice — the body of knowledge, methods, and resources that
  members develop together. Originally grounded in studies of apprenticeship and situated learning, CoP has become a foundational
  concept in knowledge management, organizational learning, education, and professional development.'
