id: social-learning-theory
type: framework
title: Social Learning Theory
tagline: Framework explaining how people learn collaboratively through observation, imitation, and social interaction in group
  settings.
description: Social Learning Theory, developed by Albert Bandura, provides a framework for understanding how individuals learn
  and develop skills through social interaction, observation, and collaboration with others. It emphasizes the importance
  of modeling, social reinforcement, and situated learning in collaborative environments. The theory has been widely applied
  to understand how teams and communities share knowledge, develop collective expertise, and support collaborative learning
  processes across various domains.
