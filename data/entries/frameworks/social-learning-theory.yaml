id: social-learning-theory
type: framework
title: Social Learning Theory
tagline: Framework explaining how people learn through observation, imitation, and modeling within collaborative environments.
description: Social Learning Theory, developed by Albert Bandura, explains how individuals learn new behaviors, skills, and
  knowledge through observing and interacting with others in their environment. In collaborative contexts, this framework
  helps understand how team members acquire competencies, adapt to group norms, and develop shared practices through peer
  observation and feedback. The theory emphasizes the role of social context, modeling, and vicarious learning in skill development,
  making it particularly relevant for understanding knowledge transfer in teams, communities of practice, and collaborative
  learning environments.
