description: 'Responsible Research and Innovation (RRI) is a European framework that promotes ethical and sustainable research
  practices through four key dimensions: anticipation of consequences, reflexivity on assumptions, inclusion of stakeholders,
  and responsiveness to societal needs. It emphasizes stakeholder engagement throughout the research process to ensure that
  scientific and technological developments align with societal values and contribute to addressing grand challenges. RRI
  fosters collaborative approaches between researchers, policymakers, industry, and civil society to create more democratic
  and accountable innovation processes.'
