description: 'The Cynefin Framework is a decision-making model developed by Dave Snowden that categorizes problems into five
  domains: simple, complicated, complex, chaotic, and disorder. It helps teams and organizations understand the nature of
  their situation and choose appropriate response strategies, with different collaboration approaches needed for each domain.
  The framework is particularly valuable for collaborative work as it guides when to use best practices, expert analysis,
  emergent experimentation, or crisis response modes.'
