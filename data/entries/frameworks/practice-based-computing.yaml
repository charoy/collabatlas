limitations: >-
  Practice-based computing requires sustained, long-term engagement with communities,
  making it resource-intensive and difficult to scale. The approach depends heavily
  on ethnographic skills and may be challenging for teams without social science
  training. Generalizability of findings from specific design cases to broader
  contexts remains an ongoing methodological challenge.
