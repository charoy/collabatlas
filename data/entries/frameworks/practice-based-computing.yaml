id: practice-based-computing
type: framework
title: Practice-Based Computing
tagline: Design approach grounding computing system development in empirical studies of real-world work practices.
description: >-
  Practice-Based Computing (PBC) is a design and research framework that insists
  computing systems should be designed based on detailed empirical understanding of
  actual work and collaboration practices. Rooted in the ethnomethodological and
  CSCW traditions, PBC emerged from the work of Volker Wulf and colleagues at the
  University of Siegen. The framework integrates ethnographic fieldwork, participatory
  design, and iterative system development into sustained engagement with communities
  of practice. It employs sensitizing concepts (after Blumer 1954) to translate
  fieldwork observations into design implications, and design case studies to
  document and share design knowledge holistically across the phases of a
  practice-oriented design process. PBC has been applied across domains including
  crisis management, healthcare, education, and community-based organizations.
