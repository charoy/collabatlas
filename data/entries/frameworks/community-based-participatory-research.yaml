description: Community-Based Participatory Research (CBPR) is a collaborative approach that equitably involves community members
  as co-researchers throughout all phases of the research process, from problem identification to dissemination of results.
  This framework emphasizes shared decision-making, capacity building, and ensuring that research benefits the communities
  being studied rather than extracting knowledge from them. CBPR is particularly valuable for addressing health disparities,
  social justice issues, and complex community challenges by combining academic expertise with lived community experience.
  The approach builds trust, enhances research relevance, and creates sustainable solutions that communities can implement
  and maintain.
