id: socio-technical-systems
type: framework
title: Socio-Technical Systems Theory
tagline: Analytical framework for understanding the joint optimization of social and technical subsystems in organizations.
description: >-
  Socio-Technical Systems (STS) Theory is an organizational design framework
  originating from research at the Tavistock Institute of Human Relations in
  London during the 1950s and 1960s. Pioneered by Eric Trist, Fred Emery, and
  later extended by Enid Mumford and others, STS posits that organizations are
  composed of interdependent social and technical subsystems, and that optimal
  performance requires the joint optimization of both. The framework challenges
  purely technological or purely social approaches to organizational design,
  advocating instead for responsible autonomy, minimal critical specification,
  and boundary management. STS has been influential in work system design,
  information systems development, manufacturing, and healthcare improvement.
