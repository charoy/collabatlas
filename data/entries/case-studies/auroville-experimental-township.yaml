description: Auroville is an experimental township in Tamil Nadu, India, founded in 1968 as a place where people from around
  the world live together regardless of nationality, politics, religion, or social status. The community practices consensus-based
  decision-making through various councils and working groups, making it a living laboratory for collective governance and
  sustainable living. With over 3,000 residents from 60+ countries, Auroville demonstrates innovative approaches to collaborative
  urban planning, ecological regeneration, and alternative economic systems.
