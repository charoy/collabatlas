outcomes: 'The project aims to deliver: (1) a repository of up-to-date analyses, use cases and reports about emerging forms
  of long-term collaboration; (2) new conceptual constructs for modelling and designing socio-technical collaboration systems;
  (3) foundational technology components for safe, sustainable and secure collaborative services; (4) actionable visions,
  guidelines and patterns to lower the barriers to effective long-term inter-organizational collaboration.'
