id: pilot-long-term-collaboration
type: case-study
title: 'PILOT: Technologies for Long-Term Collaboration'
tagline: French PEPR research project developing technologies, visions, and guidelines for sustaining long-term distributed
  collaboration.
description: PILOT is a research project within the French PEPR (Programmes et Equipements Prioritaires de Recherche) initiative
  focused on providing technologies, visions, and guidelines that promote better collaboration in the long run while preserving
  participants' interests and enforcing their specific requirements. The project addresses the fundamental challenge that
  there is no one-size-fits-all solution for collaboration, and provides tailored approaches meeting different domains' constraints.
  PILOT aims to build a repository that becomes a national and international reference point for individuals and organizations
  seeking resources to support long-term distributed collaboration, encompassing all dimensions of the collaborative socio-technical
  stack including technology, use cases, demonstrators, guidelines, and visions. The project spans domains including civil
  security (crisis management), education, publishing, and web development, applying practice-based computing approaches to
  understand and support collaboration in these varied contexts.
