title: OpenStreetMap
tagline: Volunteer-driven open geographic data project creating a free editable map of the world through mass collaboration.
description: OpenStreetMap (OSM) is a collaborative project to create a free, editable map of the entire world, built primarily
  by volunteers using GPS devices, aerial imagery, and local knowledge. Founded in 2004, it has grown into one of the largest
  and most successful crowdsourcing initiatives in history, with millions of contributors mapping roads, buildings, land use,
  and points of interest across every country. The project operates under open-data principles, making its geographic database
  freely available for any use. OSM data underpins applications ranging from humanitarian disaster response to commercial
  navigation and urban planning analysis.
