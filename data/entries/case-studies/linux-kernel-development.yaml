id: linux-kernel-development
type: case-study
title: Linux Kernel Development
tagline: The world's most successful open-source collaborative software project, with thousands of contributors across organizations.
description: The Linux kernel is the most widely deployed operating system kernel in the world, powering servers, mobile devices,
  embedded systems, and supercomputers. Its development model — distributed, open-source, and meritocratic — has been extensively
  studied as a paradigm for large-scale collaborative software engineering. The project coordinates thousands of contributors
  from hundreds of organizations through a patch-based workflow, mailing list discussions, and a hierarchical maintainer structure.
  It demonstrates how trust, technical norms, and tooling (Git) enable massive distributed collaboration without central control.
