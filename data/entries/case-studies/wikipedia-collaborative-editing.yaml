outcomes: >-
  Wikipedia has become the world's largest reference work, demonstrating that
  open, distributed collaboration can produce high-quality knowledge at scale.
  Research has identified key success factors including clear contribution norms,
  transparent governance, and robust conflict resolution mechanisms.
