id: international-space-station
type: case-study
title: "International Space Station (ISS)"
tagline: Multi-national collaborative engineering and science project involving five space agencies across 15 countries.
description: >-
  The International Space Station is the largest human-made structure in orbit and
  represents one of the most ambitious international collaborative engineering projects
  ever undertaken. Initiated in 1998, the ISS involves the coordinated efforts of five
  major space agencies — NASA, ESA, JAXA, Roscosmos, and CSA — along with contributions
  from 15 countries. The station serves as a microgravity research laboratory where
  scientists conduct experiments in biology, physics, materials science, and Earth
  observation. Its construction and continuous operation required developing novel
  protocols for cross-cultural communication, shared decision-making, and technical
  interoperability across vastly different engineering traditions and organizational cultures.
