description: NHS Integrated Care Systems (ICS) are partnerships that bring together NHS organizations, local authorities,
  and voluntary sector partners across England to plan and deliver joined-up health and care services. Established through
  the Health and Care Act 2022, ICS represent a fundamental shift from competition to collaboration in healthcare delivery.
  These systems aim to improve population health outcomes through coordinated care planning, shared decision-making, and integrated
  service delivery across traditional organizational boundaries.
