description: The Human Genome Project was a groundbreaking international scientific collaboration from 1990-2003 that successfully
  mapped and sequenced the entire human genome. This massive undertaking involved thousands of researchers across 20 institutions
  in six countries, demonstrating how large-scale distributed collaboration could tackle complex scientific challenges. The
  project pioneered new models of open data sharing and international scientific cooperation, making all genomic data freely
  available to researchers worldwide. It serves as a landmark example of how coordinated global collaboration can achieve
  scientific breakthroughs that would be impossible for any single institution.
