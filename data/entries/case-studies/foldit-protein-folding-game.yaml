id: foldit-protein-folding-game
type: case-study
title: Foldit Protein Folding Game
tagline: Crowdsourced protein folding puzzle game where players collectively solve complex biochemistry problems through gamified
  collaboration.
description: Foldit is an online puzzle game developed by the University of Washington that harnesses the collective intelligence
  of players to solve protein folding problems that are computationally challenging for traditional algorithms. Players collaborate
  through forums, share strategies, and compete in teams to find optimal protein structures, contributing to real scientific
  discoveries including HIV enzyme design and COVID-19 research. The project demonstrates how gamification can mobilize distributed
  human intelligence for complex scientific problem-solving.
