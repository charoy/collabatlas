id: oslo-urban-codesign
type: case-study
title: Oslo Fjord City Participatory Urban Planning
tagline: Large-scale participatory co-design process for Oslo's waterfront transformation involving thousands of citizens.
description: >-
  The Fjord City project in Oslo (Fjordbyen) is a long-running urban transformation
  initiative that converted former industrial port areas into mixed-use public
  spaces. The planning process incorporated extensive participatory design elements,
  including public consultations, citizen workshops, design competitions, and
  iterative feedback loops between planners, architects, and residents. The project
  is notable for its multi-decade timeline, the scale of citizen engagement, and
  its integration of participatory methods into formal municipal planning processes.
  It has been studied as a model for large-scale urban co-design.
