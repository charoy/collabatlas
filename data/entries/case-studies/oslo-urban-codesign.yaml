outcomes: >-
  The Fjord City project transformed over 8 km of Oslo's waterfront into
  publicly accessible spaces. The participatory process increased public trust
  in planning decisions and produced designs that better reflected community needs.
  The project is cited as a model for integrating participatory methods into
  large-scale municipal planning.
