title: Cochrane Systematic Reviews
tagline: Global network of researchers collaboratively producing evidence-based healthcare systematic reviews
description: Cochrane is an international network of researchers, healthcare professionals, and consumers who collaborate
  to produce high-quality systematic reviews of healthcare interventions. The organization coordinates distributed teams across
  multiple countries to conduct rigorous evidence synthesis, involving standardized methodologies, peer review processes,
  and open collaboration protocols. With over 37,000 contributors worldwide, Cochrane demonstrates large-scale scientific
  collaboration that directly impacts global healthcare policy and practice.
