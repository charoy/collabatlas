description: Mondragon Corporation is a federation of worker cooperatives based in the Basque region of Spain, founded in
  1956 by Catholic priest José María Arizmendiarrieta. It demonstrates how collaborative governance and democratic decision-making
  can operate at massive scale, encompassing over 260 companies across manufacturing, retail, finance, and education with
  more than 80,000 worker-owners. The cooperative model emphasizes shared ownership, participatory management, and solidarity
  principles, making it one of the world's largest examples of successful worker cooperation in business.
