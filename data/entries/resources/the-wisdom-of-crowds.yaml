id: the-wisdom-of-crowds
type: resource
title: The Wisdom of Crowds
tagline: Foundational book exploring how groups of people can be smarter than the smartest people in them when conditions
  are right.
description: 'James Surowiecki''s influential book examines the conditions under which groups make better decisions than individuals,
  drawing from economics, psychology, and sociology. It explores four key conditions for crowd wisdom: diversity of opinion,
  independence of members, decentralization, and aggregation mechanisms. The book provides essential theoretical grounding
  for understanding collective intelligence in crowdsourcing, participatory decision-making, and distributed problem-solving
  initiatives.'
