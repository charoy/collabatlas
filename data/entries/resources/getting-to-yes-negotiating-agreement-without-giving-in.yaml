title: 'Getting to Yes: Negotiating Agreement Without Giving In'
tagline: Classic guide to principled negotiation and collaborative problem-solving in conflict situations.
description: A foundational book by Roger Fisher and William Ury that presents the Harvard Negotiation Project's method for
  reaching mutually beneficial agreements. The book introduces principled negotiation techniques that focus on interests rather
  than positions, enabling collaborative solutions even in adversarial contexts. Widely used in business, diplomacy, and conflict
  resolution, it provides practical frameworks for transforming competitive negotiations into collaborative problem-solving
  processes.
