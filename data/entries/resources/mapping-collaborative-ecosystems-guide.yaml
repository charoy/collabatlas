description: A comprehensive methodological guide that provides frameworks and tools for systematically mapping, visualizing,
  and analyzing complex networks of collaborative actors and their relationships within organizational and social ecosystems.
  This resource helps researchers, consultants, and organizational leaders understand the structure, dynamics, and influence
  patterns of collaborative networks to improve coordination and outcomes. The guide combines network analysis techniques
  with participatory mapping methods to create actionable insights for strengthening collaborative capacity.
