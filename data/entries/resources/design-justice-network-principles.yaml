description: The Design Justice Network Principles are a set of ten community-generated principles that center equity and
  liberation in design processes, emphasizing the voices and leadership of those most impacted by design decisions. These
  principles guide collaborative design work to be more inclusive, accountable, and focused on dismantling systemic oppression
  rather than perpetuating it. They provide a framework for designers, researchers, and community organizers to approach collaborative
  work in ways that redistribute power and prioritize community self-determination.
