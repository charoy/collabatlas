id: the-winograd-and-flores-framework-understanding-computers-and-cognition
type: resource
title: 'The Winograd and Flores Framework: Understanding Computers and Cognition'
tagline: Foundational text on language, communication, and design for collaborative computer systems.
description: Terry Winograd and Fernando Flores' seminal work established key principles for designing computer systems that
  support human collaboration and communication. The book introduces concepts of breakdown and transparency in tool use, arguing
  that effective collaborative technology should become invisible in use while supporting natural human interaction. Their
  framework has influenced decades of CSCW research and continues to guide the design of collaborative systems that respect
  human cognition and social practices.
