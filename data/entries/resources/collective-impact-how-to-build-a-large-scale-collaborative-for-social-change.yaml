title: 'Collective Impact: How to Build a Large-Scale Collaborative for Social Change'
tagline: A comprehensive guide to implementing the collective impact framework for large-scale social change initiatives.
description: This influential book by John Kania and Mark Kramer provides practical guidance for implementing collective impact
  initiatives that bring together diverse organizations to solve complex social problems. The resource offers detailed frameworks,
  tools, and real-world examples for coordinating multi-organizational collaborations at scale. It has become a foundational
  text for practitioners working on systemic social change, community development, and cross-sector partnerships.
