id: collaboration-in-the-cloud
type: resource
title: "Collaboration in the Cloud: How Cross-Boundary Collaboration Is Transforming Business"
tagline: Research-based guide to cross-boundary collaboration enabled by cloud technologies and digital platforms.
description: >-
  This book by Mark McDonald and Günter Müller-Stewens examines how digital
  platforms and cloud technologies are enabling new forms of cross-boundary
  collaboration between organizations, teams, and individuals. Drawing on
  extensive case research, it provides frameworks for understanding and designing
  effective collaborative arrangements in distributed, multi-organizational
  contexts. Topics include platform governance, trust in virtual teams, knowledge
  sharing across organizational boundaries, and the management of collaborative
  ecosystems.
