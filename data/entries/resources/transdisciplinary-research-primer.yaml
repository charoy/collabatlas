description: A comprehensive guide to transdisciplinary research approaches that integrate knowledge from multiple academic
  disciplines with practical expertise from practitioners, policymakers, and community stakeholders. This resource addresses
  the methodological challenges of bridging different knowledge systems and provides frameworks for collaborative research
  that tackles complex real-world problems. It emphasizes co-creation of knowledge and the importance of participatory approaches
  in research design and implementation.
