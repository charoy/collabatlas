title: 'Collective Intelligence: Creating a Prosperous World at Peace'
tagline: Seminal book on harnessing collective intelligence for addressing global challenges through collaborative approaches.
description: Written by Tom Atlee, this influential book explores how collective intelligence emerges from collaboration and
  can be systematically cultivated to solve complex societal problems. It presents frameworks for designing collaborative
  processes that tap into the wisdom of groups, communities, and networks. The book has become a foundational text for practitioners
  working on participatory democracy, citizen engagement, and collaborative governance initiatives.
