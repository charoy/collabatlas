description: InnerSource Patterns is a community-driven collection of documented best practices for implementing open source
  collaboration methods within private organizations. These patterns help companies adopt transparent, collaborative development
  practices while maintaining proprietary boundaries, drawing from successful open source projects like Linux and Apache.
  The patterns cover everything from governance structures and contribution workflows to cultural transformation and tool
  selection for internal collaborative development.
