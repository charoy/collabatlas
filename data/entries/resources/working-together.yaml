id: working-together
type: resource
title: "Working Together"
tagline: "Olson & Olson's research-based guide examining factors that affect distributed work, including technology, social dynamics, and organizational structures."
description: >-
  Working Together by Gary M. Olson and Judith S. Olson synthesizes decades of research
  on distributed and collaborative work, drawing from the authors' influential
  contributions to the field of computer-supported cooperative work. The book examines
  the key factors that determine whether distributed teams succeed or fail, including
  the nature of the work, common ground among collaborators, coupling of tasks,
  collaboration readiness, and technology readiness. It provides an evidence-based
  framework for understanding why distance still matters in collaboration despite
  advances in communication technology. The work is essential reading for researchers,
  managers, and designers working to support geographically distributed teams and
  organizations.
