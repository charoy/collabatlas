title: "The Handbook of Science and Technology Studies"
tagline: Comprehensive reference work covering key theories, methods, and topics in STS including co-production of knowledge, technology governance, and innovation studies.
description: >-
  The Handbook of Science and Technology Studies is a definitive reference volume that
  provides comprehensive coverage of the field of STS, encompassing the social study
  of science, technology, and medicine. Now in its fourth edition, the handbook brings
  together leading scholars to address foundational concepts such as the co-production
  of knowledge and social order, the politics of expertise, and the governance of
  emerging technologies. It covers methodological approaches including laboratory
  studies, actor-network theory, and feminist technoscience. The work serves as an
  essential resource for researchers, graduate students, and practitioners seeking to
  understand how scientific knowledge and technological systems are shaped by and
  shape social, political, and cultural contexts.
