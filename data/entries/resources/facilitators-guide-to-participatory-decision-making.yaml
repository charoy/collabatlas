description: A comprehensive practical manual by Sam Kaner that provides tools, techniques, and frameworks for leading inclusive
  group decision-making processes. The book introduces the diamond of participatory decision-making model, which maps the
  natural flow from divergent thinking to convergent agreement, helping facilitators navigate complex group dynamics. It offers
  concrete strategies for managing difficult conversations, building consensus, and ensuring all voices are heard in collaborative
  settings.
