title: The Open Source Way
tagline: Community guide to creating, nurturing, and governing open source communities, covering governance models, contributor
  engagement, and sustainable practices.
description: The Open Source Way is a community-authored guidebook published by Red Hat that distills practical wisdom on
  building and sustaining open source communities. It covers the full lifecycle of open source community management, from
  attracting and onboarding new contributors to establishing governance structures and resolving conflicts. The guide addresses
  topics including communication practices, community metrics, creating inclusive environments, and the relationship between
  corporate sponsors and volunteer contributors. Written collaboratively on GitHub, it exemplifies the open source principles
  it advocates and serves as a living document that evolves with the community's collective experience.
