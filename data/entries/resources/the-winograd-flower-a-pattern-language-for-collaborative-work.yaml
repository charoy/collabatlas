id: the-winograd-flower-a-pattern-language-for-collaborative-work
type: resource
title: 'The Winograd Flower: A Pattern Language for Collaborative Work'
tagline: A foundational framework for understanding conversational structures in collaborative work environments.
description: Developed by Terry Winograd, this pattern language describes the conversational structures that underlie all
  collaborative work, focusing on requests, promises, and commitments. It provides a systematic way to analyze and design
  collaborative processes by understanding the speech acts that coordinate human action. The framework has been influential
  in CSCW research and organizational design, offering practical tools for improving team communication and workflow coordination.
