id: designing-collaborative-systems
type: resource
title: "Designing Collaborative Systems: A Practical Guide to Ethnography"
tagline: A practical guide to using ethnographic methods for designing collaborative work systems.
description: >-
  This book by Andy Crabtree provides a practical introduction to ethnography as
  a design resource for collaborative systems. It bridges the gap between
  ethnographic fieldwork and the design of computer-supported cooperative work
  systems. The book covers core ethnographic concepts, fieldwork methods, and
  techniques for translating ethnographic findings into design requirements.
  It is widely used in HCI and CSCW courses and by practitioners designing
  sociotechnical systems.
