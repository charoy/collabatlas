when_to_use: >-
  Use Participatory Design when the end-users have specialized knowledge that
  designers lack, when buy-in and adoption are critical, or when the design
  problem involves complex social or organizational dynamics.
limitations: >-
  PD can be time-consuming and resource-intensive. Power imbalances between
  professional designers and lay participants can undermine genuine co-design.
  Scaling PD to large or dispersed communities is challenging.
