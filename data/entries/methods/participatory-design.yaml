id: participatory-design
type: method
title: Participatory Design
tagline: A design approach that actively involves all stakeholders in the design process to ensure results meet their needs.
description: >-
  Participatory Design (PD) is a design methodology that involves end-users and
  other stakeholders as active co-designers rather than passive subjects. Originating
  in Scandinavian workplace democracy movements in the 1970s, PD emphasizes mutual
  learning between designers and users, iterative prototyping, and shared decision-making
  throughout the design process. It is applied across product design, service design,
  urban planning, healthcare systems, and educational technology.
