when_to_use: >-
  Use World Cafe when you need to engage a large group in meaningful dialogue
  around important questions, when diverse perspectives must be surfaced and
  connected, or when the goal is to generate collective insight rather than
  reach a formal decision. It is especially suited for community engagement,
  strategic planning, and cross-organizational knowledge sharing.
limitations: >-
  World Cafe is not well suited for decision-making or action planning without
  additional follow-up processes. The quality of outcomes depends heavily on the
  design of the guiding questions. It can be challenging to capture and synthesize
  the richness of conversations across many tables, and virtual adaptations lose
  some of the informal cafe atmosphere that makes the method effective.
steps:
  - "Set Context: clarify the purpose of the conversation and frame the guiding questions."
  - "Create Hospitable Space: arrange the room in small cafe-style tables with materials for capturing ideas."
  - "Explore Questions: pose the first question and allow participants to discuss in small groups."
  - "Encourage Contribution: invite every participant to share perspectives and build on others' ideas."
  - "Cross-Pollinate: rotate participants to new tables while table hosts summarize previous insights for newcomers."
  - "Harvest Collective Discoveries: gather key themes and insights from all tables in a whole-group session."
