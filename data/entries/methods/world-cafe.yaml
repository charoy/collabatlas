id: world-cafe
type: method
title: World Cafe
tagline: Conversational process for exploring questions that matter through rotating small-group discussions.
description: >-
  World Cafe is a structured conversational method designed to facilitate
  collaborative dialogue among large groups of people. Developed by Juanita Brown
  and David Isaacs in the mid-1990s, it creates an informal cafe-style atmosphere
  where participants rotate between small table discussions, cross-pollinating
  ideas and building on each other's insights. Each round focuses on progressively
  deeper questions, and a table host remains to share the essence of previous
  conversations with newcomers. The method is particularly effective for surfacing
  collective intelligence and generating shared understanding around complex issues
  in communities and organizations.
