id: scrum
type: method
title: Scrum
tagline: Agile framework for iterative project management in cross-functional teams using time-boxed sprints.
description: >-
  Scrum is an agile project management framework that enables cross-functional
  teams to deliver complex products through iterative, incremental cycles called
  sprints. Originally developed by Jeff Sutherland and Ken Schwaber in the early
  1990s, Scrum defines a set of roles (Product Owner, Scrum Master, Development
  Team), artifacts (Product Backlog, Sprint Backlog, Increment), and ceremonies
  (Sprint Planning, Daily Standup, Sprint Review, Sprint Retrospective). The
  framework emphasizes transparency, inspection, and adaptation, making it one of
  the most widely adopted collaborative work methodologies in software engineering
  and beyond.
