when_to_use: >-
  Use Scrum when your team needs to deliver complex products iteratively, when
  requirements are likely to evolve, or when cross-functional collaboration and
  rapid feedback loops are essential for success. It works best with dedicated
  teams of 5-9 members working toward a shared product goal.
limitations: >-
  Scrum can be difficult to scale across large organizations without additional
  frameworks (e.g., SAFe, LeSS). It assumes a stable, dedicated team and may
  struggle with projects requiring heavy upfront design. The framework's
  prescribed roles and ceremonies can feel rigid in some organizational cultures.
steps:
  - "Sprint Planning: the team selects items from the product backlog and defines the sprint goal and sprint backlog."
  - "Daily Standup: a brief daily meeting where team members synchronize work and identify impediments."
  - "Sprint Execution: the team works collaboratively to complete the sprint backlog items within the time-box."
  - "Sprint Review: the team demonstrates the completed increment to stakeholders and gathers feedback."
  - "Sprint Retrospective: the team reflects on the sprint process and identifies improvements for the next iteration."
