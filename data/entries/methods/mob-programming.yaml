id: mob-programming
type: method
title: Mob Programming
tagline: A collaborative software development approach where the whole team works on the same thing, at the same time, in
  the same space, and at the same computer.
description: Mob Programming extends pair programming to include the entire team working together on a single task using one
  shared computer and display. The approach emphasizes continuous collaboration, knowledge sharing, and collective code ownership.
  It reduces silos, improves code quality through real-time review, and accelerates learning across the team. Teams typically
  rotate who is "driving" (typing) while others navigate and contribute ideas.
