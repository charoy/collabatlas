id: standups
type: method
title: Standups
tagline: Short, frequent team meetings where members share progress, plans, and obstacles to maintain alignment and identify
  collaboration needs.
description: Standups are brief, regular team meetings (typically daily) where each participant shares what they accomplished,
  what they plan to work on, and any blockers they're facing. Originally from Agile software development, this method has
  spread across domains as an effective way to maintain team coordination, surface collaboration opportunities, and quickly
  address impediments. The format promotes transparency, accountability, and rapid problem-solving while keeping meetings
  focused and time-bounded.
