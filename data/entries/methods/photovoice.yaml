description: Photovoice is a participatory research methodology that empowers community members to document their lived experiences
  and perspectives through photography, followed by facilitated discussions about the images and their meanings. Originally
  developed by Caroline Wang and Mary Ann Burris, this method combines photography with critical dialogue to identify community
  strengths and concerns, particularly around health and social issues. The process typically involves participants taking
  photographs, reflecting on their images through structured discussions, and using the visual narratives to advocate for
  policy change or community action.
