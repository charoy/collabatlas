title: Pair Programming
tagline: Two programmers work together at one workstation, with one writing code while the other reviews each line in real-time.
description: Pair programming is an agile software development technique where two developers collaborate at a single computer,
  continuously switching between 'driver' (writing code) and 'navigator' (reviewing and guiding) roles. This method enhances
  code quality through immediate peer review, knowledge sharing, and collective problem-solving. It reduces bugs, improves
  design decisions, and facilitates skill transfer between team members, making it a cornerstone practice in collaborative
  software development.
