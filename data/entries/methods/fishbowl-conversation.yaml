id: fishbowl-conversation
type: method
title: Fishbowl Conversation
tagline: A structured discussion method where active speakers sit in an inner circle while others observe and can rotate in
  to participate
description: Fishbowl conversation is a facilitation technique where a small group of participants sit in an inner circle
  (the fishbowl) to discuss a topic while others observe from an outer circle. Observers can join the conversation by taking
  an empty chair in the inner circle, creating dynamic participation that encourages active listening and inclusive dialogue.
  This method is particularly effective for large group discussions, conflict resolution, and ensuring diverse voices are
  heard in collaborative settings.
