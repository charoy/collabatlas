id: charrette
type: method
title: Charrette
tagline: Intensive collaborative design workshop bringing diverse stakeholders together to rapidly develop solutions for complex
  planning challenges.
description: A charrette is an intensive, multi-day collaborative design process that brings together community members, planners,
  architects, and other stakeholders to develop comprehensive solutions for urban planning or design challenges. Participants
  work in small interdisciplinary teams through iterative design sessions, with regular feedback loops and public presentations.
  This method emphasizes rapid prototyping, visual communication, and consensus-building to create implementable plans that
  reflect community needs and expert knowledge.
