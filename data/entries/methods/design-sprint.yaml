when_to_use: Use a Design Sprint when a team faces a high-stakes decision with significant uncertainty, when a new product
  or feature needs rapid validation, or when stakeholder alignment is needed before committing to a development path.
limitations: The five-day format can feel rushed and may not allow sufficient depth for complex problems. Sprint outcomes
  depend heavily on participant diversity and facilitation quality. Remote sprints require careful tool selection.
