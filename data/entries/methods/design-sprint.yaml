id: design-sprint
type: method
title: Design Sprint
tagline: A five-day structured process for answering critical business questions through design, prototyping, and testing.
description: 'The Design Sprint is a time-constrained, five-phase process developed at Google Ventures that uses design thinking
  to reduce the risk when bringing a new product, service, or feature to market. The sprint compresses months of work into
  a single week by moving quickly from problem definition to prototype to user testing. Each day has a specific focus: Map,
  Sketch, Decide, Prototype, and Test. Design Sprints are widely used in product teams, startups, and innovation labs.'
