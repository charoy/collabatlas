title: Lean Startup
tagline: Iterative methodology for developing products through validated learning, customer feedback, and rapid experimentation
  cycles.
description: Lean Startup is a methodology for developing businesses and products through build-measure-learn feedback loops.
  It emphasizes collaborative experimentation with customers, cross-functional team collaboration, and iterative development
  based on validated learning. The approach enables teams to work together to rapidly test hypotheses, pivot based on data,
  and build products that customers actually want through continuous collaboration between development teams and users.
