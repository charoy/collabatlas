when_to_use: >-
  Use the Delphi Method when expert consensus is needed on complex or uncertain
  topics, when face-to-face meetings are impractical, or when anonymity is
  desirable to prevent dominant voices from skewing results.
limitations: >-
  The method can be slow and may suppress minority viewpoints through pressure
  toward consensus. The quality of results depends heavily on the selection of
  appropriate experts and the skill of the facilitator.
