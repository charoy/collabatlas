id: delphi-method
type: method
title: Delphi Method
tagline: Structured expert consultation technique using iterative questionnaire rounds to build consensus.
description: >-
  The Delphi Method is a structured communication technique that relies on a panel
  of experts who respond to questionnaires in multiple rounds. After each round,
  a facilitator provides an anonymized summary of the experts' forecasts and the
  reasons they provided. Experts are encouraged to revise their earlier answers
  in light of the replies of other members. The process stops when a predefined
  consensus criterion is reached. It is widely used in policy research, healthcare
  priority-setting, technology forecasting, and curriculum design.
