id: agile-planning-poker
type: method
title: Agile Planning Poker
tagline: Consensus-based estimation technique where team members use cards to anonymously estimate effort or complexity of
  work items.
description: Planning Poker is a collaborative estimation method used primarily in agile software development where team members
  independently estimate the relative size or effort of user stories or tasks using a standardized set of cards (typically
  Fibonacci sequence). After revealing estimates simultaneously, team members discuss differences and re-estimate until consensus
  is reached. This method combines the wisdom of crowds with structured discussion to improve estimation accuracy while fostering
  shared understanding of requirements and reducing anchoring bias in group decision-making.
