description: A deliberative democratic method that brings together randomly selected representative groups of citizens to
  learn about complex policy issues, deliberate together, and develop informed recommendations for policymakers. Citizens'
  assemblies create structured environments for diverse perspectives to engage in evidence-based dialogue, often lasting several
  months with expert input and professional facilitation. This method has been successfully used for contentious issues like
  climate policy, electoral reform, and abortion rights, demonstrating how collaborative deliberation can bridge political
  divides and generate nuanced policy solutions.
