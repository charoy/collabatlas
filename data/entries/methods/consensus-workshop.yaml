title: Consensus Workshop
tagline: Structured group decision-making method that builds agreement through systematic discussion and iterative refinement
  of options.
description: Consensus Workshop is a facilitated method for reaching group agreement on complex issues through structured
  dialogue, option generation, and iterative refinement. Participants work together to identify common ground, address concerns,
  and modify proposals until all members can accept the final decision. This method emphasizes collaborative problem-solving
  over voting, ensuring that all voices are heard and that the final outcome has broad support from the group.
