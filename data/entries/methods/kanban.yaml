id: kanban
type: method
title: Kanban
tagline: Visual workflow management method using boards, columns, and cards to optimize team collaboration and continuous
  improvement.
description: Kanban is a lean project management methodology that visualizes work in progress using boards with columns representing
  different stages of a workflow. Teams collaborate by moving cards representing work items through these stages, making bottlenecks
  and dependencies visible to all members. Originally developed for manufacturing, it has been widely adopted in software
  development and knowledge work to improve team coordination, limit work in progress, and enable continuous delivery through
  shared visibility and collective ownership of the workflow.
