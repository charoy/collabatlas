id: affinity-mapping
type: method
title: Affinity Mapping
tagline: Visual method for collaborative analysis and pattern identification by clustering related ideas and observations
description: Affinity mapping is a collaborative sense-making method where team members organize large amounts of data, ideas,
  or observations into meaningful clusters based on relationships and themes. Participants work together to physically or
  digitally group related items, then identify patterns and insights that emerge from the clustering process. This method
  is widely used in design research, user experience work, and cross-functional team analysis to transform raw data into actionable
  insights through collective interpretation.
