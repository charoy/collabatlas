when_to_use: >-
  Use Action Research when you need to solve a practical problem while
  simultaneously contributing to theoretical knowledge, when practitioner
  involvement is essential for understanding the problem context, or when
  the research aims to produce change in a social system. It is particularly
  suited for situations where traditional research approaches fail to capture
  the complexity of real-world practice.
limitations: >-
  Action Research can be time-intensive due to its cyclical nature and the
  need for ongoing practitioner engagement. Findings may lack generalizability
  because they are deeply situated in specific contexts. Dual roles of
  researcher and practitioner can create tensions around objectivity and rigor.
  Institutional review boards may find the emergent design challenging to
  evaluate.
steps:
  - "Diagnose: identify and define the problem collaboratively with stakeholders in the practice setting."
  - "Plan Action: design an intervention or change strategy based on the diagnosis and relevant theory."
  - "Take Action: implement the planned intervention in the real-world practice context."
  - "Evaluate: collect and analyze data on the effects of the intervention using appropriate methods."
  - "Reflect: critically examine outcomes, process, and assumptions with all participants."
  - "Specify Learning: document insights, revise theory, and feed learning into the next action cycle."
