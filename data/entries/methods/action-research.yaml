id: action-research
type: method
title: Action Research
tagline: Cyclical research methodology combining practical problem-solving with knowledge generation through practitioner involvement.
description: >-
  Action Research is a participatory research methodology in which practitioners
  and researchers collaborate to address real-world problems through iterative
  cycles of planning, acting, observing, and reflecting. Rooted in the work of
  Kurt Lewin in the 1940s and later expanded by scholars such as Chris Argyris,
  Donald Schon, and Peter Reason, the approach treats research participants as
  co-investigators rather than subjects. Action Research bridges the gap between
  theory and practice by generating actionable knowledge that is both locally
  relevant and contributes to broader scholarly understanding. It is widely used
  in education, healthcare, social work, and community development.
