when_to_use: Use Open Space Technology when a diverse group of people must address a complex issue with no pre-defined solution,
  when you want to maximize participant ownership and engagement, or when traditional agendas fail to capture the real concerns
  of stakeholders. It works best when there is genuine passion and potential conflict around the topic.
limitations: OST requires a willingness from organizers to relinquish control over the agenda, which can be uncomfortable
  for hierarchical organizations. Outcomes can be unpredictable and may not align with management expectations. The method
  is less effective when there is a need for highly structured decision-making or when participants lack genuine interest
  in the topic.
steps:
- 'Open Circle: the facilitator welcomes participants, introduces the theme, and explains the principles and the Law of Two
  Feet.'
- 'Marketplace of Ideas: participants propose session topics and post them on the agenda wall, then negotiate times and spaces.'
- 'Breakout Sessions: self-selected groups meet to discuss their chosen topics, with conveners capturing notes and action
  items.'
- 'Evening News: at the end of each session round, the whole group reconvenes to share highlights and emerging themes.'
- 'Closing Circle: the group gathers for final reflections, commitments, and next steps.'
