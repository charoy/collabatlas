id: open-space-technology
type: method
title: Open Space Technology
tagline: Self-organizing meeting format where participants create and manage their own agenda.
description: Open Space Technology (OST) is a facilitation method created by Harrison Owen in the mid-1980s for running productive
  meetings and conferences without a pre-determined agenda. Participants propose topics they are passionate about, post them
  on a shared marketplace wall, and then self-organize into breakout sessions. The method is governed by four principles and
  one law (the Law of Two Feet), which encourages participants to move freely to wherever they can learn or contribute the
  most. OST has been used with groups ranging from five to over two thousand people and is valued for its ability to surface
  emergent topics and harness participant energy around real issues.
