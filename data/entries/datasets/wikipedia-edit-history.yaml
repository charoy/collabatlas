id: wikipedia-edit-history
type: dataset
title: "Wikipedia Edit History Dumps"
tagline: Complete revision history of all Wikimedia projects, enabling analysis of collaborative knowledge production at scale.
description: >-
  The Wikipedia Edit History Dumps provide the complete revision history of all
  Wikimedia projects, including every edit made to every article since Wikipedia's
  founding in 2001. The dumps include article text, edit metadata, editor information,
  talk page discussions, and administrative actions. This dataset is one of the most
  extensively studied resources in computational social science, enabling research
  on collaborative knowledge production, conflict resolution, consensus formation,
  and the dynamics of volunteer-driven online communities. The sheer scale of the
  data — encompassing billions of edits across hundreds of language editions — makes
  it a unique resource for understanding large-scale human collaboration.
