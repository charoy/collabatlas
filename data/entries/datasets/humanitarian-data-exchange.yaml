description: The Humanitarian Data Exchange (HDX) is UNOCHA's open platform that enables humanitarian organizations to find
  and share crisis data across emergency responses worldwide. It serves as a central repository where NGOs, UN agencies, governments,
  and other actors can access standardized datasets on conflicts, natural disasters, population movements, and infrastructure
  to coordinate more effective humanitarian interventions. The platform facilitates data-driven decision making and reduces
  duplication of efforts during crisis response by providing a common data sharing infrastructure.
