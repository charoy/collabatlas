id: cscw-proceedings-corpus
type: dataset
title: ACM CSCW Proceedings Corpus
tagline: Full-text corpus of ACM CSCW conference papers for studying the evolution of collaborative computing research.
description: >-
  The ACM CSCW Proceedings Corpus comprises the full-text papers published at
  the ACM Conference on Computer-Supported Cooperative Work and Social Computing
  since its inception in 1986. The corpus is accessible via the ACM Digital Library
  and has been used in bibliometric analyses, topic modeling studies, and
  systematic reviews of collaborative computing research. It documents the
  evolution of the CSCW field, shifting research foci, and the emergence of
  new collaboration paradigms over four decades.
