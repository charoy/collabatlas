id: stack-overflow-survey
type: dataset
title: "Stack Overflow Developer Survey"
tagline: Annual survey dataset of developer demographics, technology usage, and work practices from the world's largest programming community.
description: >-
  The Stack Overflow Developer Survey is one of the most comprehensive annual surveys
  of software developers worldwide, collecting data on demographics, education,
  employment, technology preferences, and work practices. Conducted since 2011, the
  survey consistently attracts tens of thousands of respondents from across the global
  developer community. The resulting datasets provide rich longitudinal insights into
  trends in programming languages, frameworks, tools, and developer satisfaction.
  Researchers and industry analysts widely use this data to study workforce dynamics,
  technology adoption patterns, and the evolving nature of software development work.
