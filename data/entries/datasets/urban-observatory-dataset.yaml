description: The Urban Observatory Dataset is a comprehensive collection of comparative data from cities worldwide, providing
  standardized metrics on urban development patterns, governance structures, and environmental indicators. Maintained by the
  Newcastle Urban Observatory and partner institutions, it enables researchers, policymakers, and urban planners to analyze
  cross-city trends and evidence-based policy making. The dataset supports collaborative urban research by providing a shared
  foundation for comparative studies and knowledge exchange between cities facing similar challenges.
