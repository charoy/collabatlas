description: A comprehensive REST API providing structured metadata for over 130 million scholarly publications, including
  journal articles, books, and conference proceedings from thousands of publishers worldwide. The API enables researchers
  to access bibliographic information, citation data, author affiliations, and funding details, making it essential for analyzing
  collaboration patterns, co-authorship networks, and research impact across disciplines. It serves as a critical infrastructure
  for scholarly communication tools, citation managers, and research analytics platforms.
