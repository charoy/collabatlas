id: github-archive
type: dataset
title: GH Archive
tagline: Public dataset of GitHub activity events for studying open-source collaboration at scale.
description: >-
  GH Archive is a project that records the public GitHub timeline and makes it
  available for further analysis. It captures all public GitHub events — including
  commits, pull requests, issues, forks, stars, and comments — and archives them
  as compressed JSON files. The dataset is widely used in empirical software
  engineering research to study collaboration patterns, contributor dynamics,
  project health, and open-source ecosystem evolution. It is available via Google
  BigQuery for large-scale analysis.
