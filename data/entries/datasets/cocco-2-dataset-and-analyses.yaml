type: dataset
title: COCCO 2 dataset and analyses
tagline: Dataset and analyss of the COCCO 2 experiment
description: The COCCO 2 dataset contains data and analyses from a collaborative learning experiment studying computer-supported
  cooperative work in educational settings. This dataset provides insights into how students collaborate in digital environments
  and the factors that influence successful group learning outcomes. It serves as a valuable resource for researchers studying
  collaborative learning patterns and the effectiveness of different cooperative work strategies in educational contexts.
