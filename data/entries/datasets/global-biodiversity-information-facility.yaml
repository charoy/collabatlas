description: GBIF is a global research infrastructure that provides free and open access to biodiversity data from over 2,000
  institutions worldwide. The platform enables researchers, policymakers, and citizens to access more than 2 billion species
  occurrence records for scientific research and conservation efforts. It facilitates international collaboration in biodiversity
  research by standardizing data formats and providing tools for data discovery, analysis, and visualization.
