id: recherche-data-gouv
type: dataset
title: Recherche Data Gouv
tagline: French national research data repository for open science and collaborative data sharing.
description: >-
  Recherche Data Gouv is France's national federated research data repository,
  operated as part of the country's open science policy. It provides researchers
  with infrastructure for depositing, describing, sharing, and preserving research
  datasets across all disciplines. Built on the Dataverse platform, it supports
  FAIR data principles (Findable, Accessible, Interoperable, Reusable) and offers
  institutional and thematic data spaces. The platform facilitates collaborative
  data sharing between research teams and institutions, addressing governance and
  sustainability challenges in long-term data stewardship. It serves as a key
  element of the French research infrastructure ecosystem alongside HAL (for
  publications) and Software Heritage (for source code).
