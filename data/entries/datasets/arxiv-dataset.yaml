id: arxiv-dataset
type: dataset
title: "arXiv Bulk Access Dataset"
tagline: Complete metadata and full-text corpus of over 2 million scientific preprints across physics, mathematics, computer science, and other fields.
description: >-
  The arXiv Bulk Access Dataset provides comprehensive metadata and full-text access
  to over 2 million scientific preprints hosted on arXiv.org, the pioneering open-access
  preprint repository founded in 1991. The dataset spans physics, mathematics, computer
  science, quantitative biology, quantitative finance, statistics, and electrical
  engineering. It is widely used for bibliometric analysis, scientometric research,
  natural language processing, and studies of scientific collaboration networks.
  The availability of both structured metadata and source documents makes it an
  invaluable resource for understanding patterns of knowledge production, citation
  dynamics, and the evolution of scientific disciplines over more than three decades.
