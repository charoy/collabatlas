id: zoom
type: tool
title: Zoom
tagline: Cloud-based video conferencing platform enabling real-time meetings, webinars, and remote collaboration at scale.
description: >-
  Zoom is a cloud-based video conferencing platform that supports real-time video
  meetings, screen sharing, breakout rooms, and recording capabilities for
  distributed teams and large-scale virtual events. It became foundational
  infrastructure for remote collaboration during the COVID-19 pandemic and
  remains widely adopted across education, business, healthcare, and research
  sectors. Zoom's scalable architecture accommodates everything from one-on-one
  calls to webinars with thousands of participants, and its ease of use has made
  it a primary tool for synchronous communication in distributed work practices.
