title: Kialo
tagline: A structured debate platform that helps teams and communities explore complex issues through organized argument mapping
  and collaborative reasoning.
description: Kialo is a web-based platform designed for structured argumentation and collaborative debate. Users can create
  debate trees where arguments are organized hierarchically, with claims supported or challenged by sub-arguments. The platform
  enables teams to systematically explore different perspectives on complex issues, making it valuable for decision-making
  processes, policy analysis, and educational discussions where multiple viewpoints need to be considered and evaluated collectively.
