title: XWiki
tagline: Open-source collaborative wiki platform for knowledge management and structured
  collaboration.
description: XWiki is an open-source wiki platform written in Java that enables organizations
  to create collaborative workspaces for knowledge management, documentation, and
  structured data applications. Unlike simple wikis, XWiki provides a full application
  development platform with scripting capabilities, structured data support, and extension
  mechanisms. It supports real-time collaborative editing, version control, access
  control, and can be extended through a rich ecosystem of extensions. XWiki has been
  adopted by organizations ranging from small teams to large enterprises and research
  institutions, and serves as a platform for building custom collaborative applications.
