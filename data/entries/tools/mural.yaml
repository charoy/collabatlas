title: Mural
tagline: Digital workspace for visual collaboration with sticky notes, diagrams, and facilitation features for distributed
  teams.
description: Mural is a digital workspace platform that enables teams to collaborate visually through virtual whiteboards,
  sticky notes, diagrams, and interactive templates. It supports structured facilitation of design thinking sessions, workshops,
  and brainstorming activities across distributed teams. The platform includes features like voting, timers, and guided workflows
  that help teams move from ideation to decision-making in collaborative sessions.
