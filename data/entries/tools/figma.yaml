id: figma
type: tool
title: Figma
tagline: Collaborative interface design tool for teams to create, prototype, and iterate together.
description: >-
  Figma is a cloud-based collaborative design tool that allows teams to create
  user interfaces, prototypes, and design systems in real time. Multiple
  designers and stakeholders can work simultaneously on the same file, with
  changes visible instantly to all participants. Figma supports the full design
  workflow from wireframing to high-fidelity prototyping, and includes features
  like shared component libraries, design tokens, and developer handoff tools.
  It integrates with popular platforms such as Slack, Jira, and Miro to
  streamline the product design process.
