title: Discord
tagline: Community communication platform with voice, video, and text channels.
description: >-
  Discord is a communication platform originally designed for gaming communities
  that has grown into a widely used tool for real-time voice, video, and text
  collaboration. It organizes conversations into servers and channels, allowing
  communities to create structured spaces for different topics, projects, or
  teams. Discord supports features such as threaded discussions, screen sharing,
  stage channels for events, and a rich ecosystem of bots and integrations. It
  has become popular among open-source projects, educational groups, and
  citizen-science communities as an accessible platform for distributed
  collaboration and community building.
