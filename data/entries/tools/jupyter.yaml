id: jupyter
type: tool
title: Jupyter Notebook
tagline: Interactive computing environment for collaborative data science and reproducible research.
description: >-
  Jupyter Notebook is an open-source web application that allows researchers and
  data scientists to create and share documents containing live code, equations,
  visualizations, and narrative text. It is widely used for collaborative data
  analysis, scientific computing, and reproducible research workflows. JupyterHub
  extends this to multi-user environments, enabling team-based collaboration on
  shared infrastructure.
