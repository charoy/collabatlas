description: Gather Town is a virtual space platform that combines video conferencing with 2D spatial environments, allowing
  users to move avatars around interactive maps and automatically connect with nearby participants. It recreates the spontaneous
  interactions of physical spaces by using proximity-based audio and video, making remote collaboration feel more natural
  and serendipitous. The platform is particularly valuable for virtual events, remote team building, and educational settings
  where informal networking and chance encounters are important.
