id: miro
type: tool
title: Miro
tagline: Online collaborative whiteboard platform for visual teamwork and brainstorming.
description: >-
  Miro is a cloud-based collaborative whiteboard platform that enables teams to
  work together visually in real time or asynchronously. It supports a wide range
  of use cases including brainstorming, design sprints, agile retrospectives,
  journey mapping, and workshop facilitation. Miro provides hundreds of templates
  and integrates with tools like Jira, Slack, and Figma.
