title: Slack
tagline: Channel-based messaging platform for team communication and distributed collaboration.
description: >-
  Slack is a cloud-based team communication platform organized around channels,
  direct messages, and integrations. It enables persistent, searchable
  conversations across distributed teams and integrates with hundreds of
  third-party tools. Slack is widely adopted in software engineering, business,
  and research organizations for coordinating asynchronous and synchronous
  collaboration across time zones.
