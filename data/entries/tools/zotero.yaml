title: Zotero
tagline: Free, open-source reference manager for collaborative research and bibliography management.
description: Zotero is a free, open-source reference management tool that helps researchers collect, organize, annotate, cite,
  and share research sources. Its group libraries feature enables teams to collaboratively build and maintain shared reference
  collections, making it widely used in interdisciplinary and academic research projects. Zotero integrates with word processors
  and supports hundreds of citation styles.
