title: Krita
tagline: Open-source digital painting application with collaborative features for artists and creative teams.
description: Krita is a professional, free and open-source digital painting application designed primarily for concept artists,
  illustrators, matte and texture artists, and the VFX industry. It supports collaborative workflows through shared brush
  packs, template sharing, and integration with version control systems. The tool enables creative teams to work together
  on digital art projects, share custom resources, and maintain consistent artistic styles across collaborative projects.
