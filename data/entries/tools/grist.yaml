id: grist
type: tool
title: Grist
tagline: A collaborative spreadsheet-database hybrid for structured data and shared workflows.
description: >-
  Grist is a relational spreadsheet-database hybrid that combines the familiarity
  of a grid with the structural integrity of a database. It allows teams to link
  tables, create drag-and-drop dashboards, and automate workflows using Excel-like
  functions or full Python formulas. Collaboration is supported through real-time
  editing and a highly sophisticated permissions system that can restrict access
  down to specific rows or individual cells, enabling large teams to work within
  a single source of truth while keeping sensitive data private. Grist is
  open-source and self-hostable, uses a portable SQLite format to prevent vendor
  lock-in, and offers an AI assistant to help non-coders generate complex
  Python-based logic.
