<article class="entry-card" data-type="{{ path.Base (path.Dir .File.Path) }}">
  <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
  {{ with .Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
  <div class="card-meta">
    {{ with .Params.maturity }}<span class="badge maturity-{{ . }}">{{ . }}</span>{{ end }}
    {{ range .Params.domains }}<span class="badge domain">{{ . }}</span>{{ end }}
    {{ range .Params.collaboration_type }}<span class="badge collaboration-type" style="display:none">{{ . }}</span>{{ end }}
    {{ range .Params.modality }}<span class="badge modality" style="display:none">{{ . }}</span>{{ end }}
    {{ range .Params.scale }}<span class="badge scale" style="display:none">{{ . }}</span>{{ end }}
  </div>
</article>
