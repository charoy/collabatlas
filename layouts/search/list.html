{{ define "main" }}
<section class="search-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="page-description">{{ . }}</p>{{ end }}
  </header>

  <link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
  <div id="search-results"></div>
  <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
  <script>
    new PagefindUI({
      element: "#search-results",
      showSubResults: true,
      showImages: false,
      baseUrl: "{{ "/" | relURL }}"
    });
    // Sync URL ?q= param
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
      setTimeout(function() {
        var input = document.querySelector('.pagefind-ui__search-input');
        if (input) { input.value = q; input.dispatchEvent(new Event('input')); }
      }, 100);
    }
  </script>
</section>
{{ end }}
