{{ define "main" }}
<section class="catalogue">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="page-description">{{ . }}</p>{{ end }}
  </header>

  {{ .Content }}

  <div class="filters" aria-label="Filter entries">
    <!-- Populated by catalogue-filter.js -->
  </div>

  <div class="entry-grid">
    {{ range .Pages }}
      {{ partial "entry-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
