{{ define "main" }}
<section class="catalogue-visualize">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="page-description">{{ .Params.description }}</p>
  </header>

  <div class="visualize-controls">
    <div class="control-group">
      <label for="x-axis-select">X-Axis (Columns)</label>
      <select id="x-axis-select">
        <option value="domains" selected>Domains</option>
        <option value="collaborationTypes">Collaboration Types</option>
        <option value="scales">Scales</option>
        <option value="modalities">Modalities</option>
        <option value="researchMethods">Research Methods</option>
        <option value="maturity">Maturity</option>
      </select>
    </div>
    <div class="control-group">
      <label for="y-axis-select">Y-Axis (Rows)</label>
      <select id="y-axis-select">
        <option value="collaborationTypes" selected>Collaboration Types</option>
        <option value="domains">Domains</option>
        <option value="scales">Scales</option>
        <option value="modalities">Modalities</option>
        <option value="researchMethods">Research Methods</option>
        <option value="maturity">Maturity</option>
      </select>
    </div>
  </div>

  <div id="visualize-chart" class="visualize-chart">
    <p class="visualize-loading">Loading visualization data...</p>
    <noscript>JavaScript is required to view this visualization.</noscript>
  </div>

  <div class="visualize-distributions-grid">
    <div class="distribution-panel">
      <h3 id="x-dist-title">Distribution</h3>
      <div id="x-distribution" class="chart-container"></div>
    </div>
    <div class="distribution-panel">
      <h3 id="y-dist-title">Distribution</h3>
      <div id="y-distribution" class="chart-container"></div>
    </div>
  </div>

  <dialog id="visualize-modal" class="visualize-modal">
    <div class="visualize-modal-inner">
      <header class="visualize-modal-header">
        <h2 id="modal-title">Intersection Details</h2>
        <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      </header>
      <div class="visualize-modal-content">
        <ul id="modal-list" class="modal-entry-list">
          <!-- Entries will be injected here -->
        </ul>
      </div>
    </div>
  </dialog>

  <script>
    console.log('Visualize script starting...');
    window.CATALOGUE_DATA_URL = '{{ "catalogue/visualize/index.json" | relURL }}';
  </script>
  {{ $vizJs := resources.Get "js/catalogue-visualize.js" | minify | fingerprint }}
  <script src="{{ $vizJs.RelPermalink }}" integrity="{{ $vizJs.Data.Integrity }}"></script>
</section>
{{ end }}
