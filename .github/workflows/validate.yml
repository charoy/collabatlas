name: Validate Entries

on:
  pull_request:
    paths:
      - 'data/entries/**'
      - 'data/research_articles.yaml'
      - 'schemas/**'
      - 'data/taxonomies/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate YAML entries against schemas
        run: python scripts/validate.py

      - name: Check for broken internal references
        run: python scripts/validate.py --check-refs

      - name: Run tests
        run: cd scripts && python -m pytest -v
