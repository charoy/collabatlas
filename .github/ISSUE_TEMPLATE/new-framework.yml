name: "Propose New Framework"
description: "Suggest a theoretical or analytical framework for the CollabAtlas catalogue."
title: "[New Framework] "
labels: ["new-entry", "framework", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Suggest a Collaborative Framework

        A **framework** is a theoretical lens or conceptual structure for analysing
        collaborative systems (e.g., Activity Theory, CSCW Framework, Communities of Practice).
        If you're unsure about taxonomy fields, pick your best guess — the editorial team will review.

  - type: input
    id: title
    attributes:
      label: Title
      description: "The name of the framework."
      placeholder: "e.g., Activity Theory, Cynefin Framework, Triple Helix Model"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: "One-sentence summary (max 200 characters)."
      placeholder: "e.g., A theoretical framework for analysing human activity systems and tool-mediated collaboration."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: "2-5 sentences. What is this framework? What phenomena does it explain? What makes it distinctive?"
      placeholder: |
        Example: Activity Theory is a cross-disciplinary framework for studying
        how humans purposefully transform their environment through tool-mediated
        activity. It emphasises the systemic relationships between subjects, tools,
        rules, community, and division of labour within an activity system.
    validations:
      required: true

  - type: checkboxes
    id: research-method
    attributes:
      label: Associated Research Methods
      description: "Which research traditions commonly use this framework?"
      options:
        - label: Action Research
        - label: Ethnography
        - label: Experimental
        - label: Survey
        - label: Case Study
        - label: Design Science
        - label: Mixed Methods
        - label: Systematic Review
        - label: Grounded Theory
        - label: Participatory Action Research

  - type: input
    id: key-concepts
    attributes:
      label: Key Concepts (comma-separated)
      placeholder: "e.g., activity system, contradiction, mediation"

  - type: textarea
    id: seminal-works
    attributes:
      label: Seminal Works
      description: "One work per line. Format: Title | Authors (comma-separated) | Year | URL (optional)"
      placeholder: |
        Activity Theory in HCI | Bonnie Nardi | 1996
        Mind in Society | Lev Vygotsky | 1978 | https://example.com

  - type: textarea
    id: limitations
    attributes:
      label: Limitations
      description: "Known limitations, challenges, or critiques of this framework."
      placeholder: "e.g., High learning curve; can be overly abstract without concrete application guidance; limited prescriptive power for practitioners."

  - type: checkboxes
    id: domains
    attributes:
      label: "Relevant Domains (select all that apply)"
      description: "In which fields is this framework commonly applied?"
      options:
        - label: "Healthcare — hospitals, clinical research, public health"
        - label: "Education — schools, universities, training"
        - label: "Urban Planning — cities, transport, housing"
        - label: "Software Engineering — development, DevOps"
        - label: "Design — UX, product design, architecture"
        - label: "Environmental Science — ecology, climate, conservation"
        - label: "Social Sciences — sociology, psychology, political science"
        - label: "Public Policy — government, civic engagement"
        - label: "Business — management, strategy, consulting"
        - label: "Arts & Culture — museums, performing arts"
        - label: "Disaster Response — emergency management, humanitarian aid"
        - label: "Citizen Science — volunteer research, community monitoring"
        - label: "Manufacturing — production, supply chain"
        - label: "Agriculture — farming, food systems"
        - label: "Publishing — journals, books, open access"
    validations:
      required: true

  - type: checkboxes
    id: collaboration-type
    attributes:
      label: "Collaboration Types (select all that apply)"
      description: "What kind of collaboration does this framework address?"
      options:
        - label: "Co-Design — stakeholders jointly design solutions"
        - label: "Co-Creation — multiple parties create something new together"
        - label: "Co-Production — shared production across organizations"
        - label: "Participatory — actively involves end-users or communities"
        - label: "Distributed — geographically dispersed teams"
        - label: "Crowdsourcing — large-scale contributions from many people"
        - label: "Open Source — publicly available, community-developed"
        - label: "Interdisciplinary — across 2-3 related disciplines"
        - label: "Transdisciplinary — across many disciplines + non-academic actors"
        - label: "Community-Based — rooted in a specific community's needs"
    validations:
      required: true

  - type: checkboxes
    id: scale
    attributes:
      label: "Scale (select all that apply)"
      description: "What group sizes does this framework typically apply to?"
      options:
        - label: "Pair — 2 people"
        - label: "Small Team (3-10)"
        - label: "Organization (11-100)"
        - label: "Multi-Organization — networks of organizations"
        - label: "Community (100+) — large open communities"
    validations:
      required: true

  - type: checkboxes
    id: modality
    attributes:
      label: "Modality (select all that apply)"
      options:
        - label: "In-Person — co-located, face-to-face"
        - label: "Remote — fully online"
        - label: "Hybrid — mix of in-person and remote"
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Maturity Level
      description: "How well-established is this framework?"
      options:
        - "Emerging — new or experimental, limited adoption"
        - "Established — proven track record, widely used"
        - "Well-Documented — extensive documentation, research, and community resources"
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: "Optional. One link per line. Format: type | URL | title"
      placeholder: |
        website | https://example.com | Official Website
        paper | https://doi.org/10.xxxx | Key Research Paper
        book | https://example.com/book | Foundational Book

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: "Free-form keywords that describe this framework. Examples below."
      placeholder: "e.g., theory, governance, innovation, knowledge-production, complexity"

  - type: input
    id: related-entries
    attributes:
      label: Related CollabAtlas Entries (comma-separated IDs)
      description: "IDs of related entries. Browse the catalogue to find IDs (the URL slug is the ID)."
      placeholder: "e.g., activity-theory, communities-of-practice, cscw-framework"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: "Any other information that would help the editorial team."
