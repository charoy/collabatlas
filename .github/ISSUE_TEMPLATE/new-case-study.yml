name: "Propose New Case Study"
description: "Document a real-world example of collaboration for the CollabAtlas catalogue."
title: "[New Case Study] "
labels: ["new-entry", "case-study", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Document a Collaborative Case Study

        A **case study** documents a real-world example of collaboration in practice
        (e.g., Wikipedia, Linux Kernel Development, Barcelona Superblock Program).
        If you're unsure about taxonomy fields, pick your best guess — the editorial team will review.

  - type: input
    id: title
    attributes:
      label: Title
      description: "The name of the case study."
      placeholder: "e.g., Barcelona Superblock Program, Galaxy Zoo, NHS Integrated Care"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: "One-sentence summary (max 200 characters)."
      placeholder: "e.g., How a city redesigned streets through participatory urban planning with residents and local businesses."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: "2-5 sentences. What happened? Who was involved? What makes this case notable for collaboration research?"
      placeholder: |
        Example: The Barcelona Superblock Program is an urban planning initiative that
        redesigned city blocks to prioritise pedestrians and community space. The project
        involved extensive participatory processes with residents, local businesses, and
        civic organisations, making it a landmark case of co-design in urban governance.
    validations:
      required: true

  - type: checkboxes
    id: research-method
    attributes:
      label: Associated Research Methods
      description: "Which research methods were used to study or document this case?"
      options:
        - label: Action Research
        - label: Ethnography
        - label: Experimental
        - label: Survey
        - label: Case Study
        - label: Design Science
        - label: Mixed Methods
        - label: Systematic Review
        - label: Grounded Theory
        - label: Participatory Action Research

  - type: input
    id: organization
    attributes:
      label: Organization
      placeholder: "Organization(s) where this took place"

  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "e.g., 2023"

  - type: textarea
    id: outcomes
    attributes:
      label: Outcomes
      placeholder: "Summary of results, findings, and impacts."

  - type: input
    id: key-concepts
    attributes:
      label: Key Concepts (comma-separated)
      placeholder: "e.g., distributed teams, governance, open data"

  - type: input
    id: methods-used
    attributes:
      label: Methods Used (CollabAtlas IDs, comma-separated)
      placeholder: "e.g., participatory-design, action-research"

  - type: input
    id: tools-used
    attributes:
      label: Tools Used (CollabAtlas IDs, comma-separated)
      placeholder: "e.g., miro, github, jupyter"

  - type: checkboxes
    id: domains
    attributes:
      label: "Relevant Domains (select all that apply)"
      description: "In which fields did this case study take place?"
      options:
        - label: "Healthcare — hospitals, clinical research, public health"
        - label: "Education — schools, universities, training"
        - label: "Urban Planning — cities, transport, housing"
        - label: "Software Engineering — development, DevOps"
        - label: "Design — UX, product design, architecture"
        - label: "Environmental Science — ecology, climate, conservation"
        - label: "Social Sciences — sociology, psychology, political science"
        - label: "Public Policy — government, civic engagement"
        - label: "Business — management, strategy, consulting"
        - label: "Arts & Culture — museums, performing arts"
        - label: "Disaster Response — emergency management, humanitarian aid"
        - label: "Citizen Science — volunteer research, community monitoring"
        - label: "Manufacturing — production, supply chain"
        - label: "Agriculture — farming, food systems"
        - label: "Publishing — journals, books, open access"
    validations:
      required: true

  - type: checkboxes
    id: collaboration-type
    attributes:
      label: "Collaboration Types (select all that apply)"
      description: "What kind of collaboration does this case study demonstrate?"
      options:
        - label: "Co-Design — stakeholders jointly design solutions"
        - label: "Co-Creation — multiple parties create something new together"
        - label: "Co-Production — shared production across organizations"
        - label: "Participatory — actively involves end-users or communities"
        - label: "Distributed — geographically dispersed teams"
        - label: "Crowdsourcing — large-scale contributions from many people"
        - label: "Open Source — publicly available, community-developed"
        - label: "Interdisciplinary — across 2-3 related disciplines"
        - label: "Transdisciplinary — across many disciplines + non-academic actors"
        - label: "Community-Based — rooted in a specific community's needs"
    validations:
      required: true

  - type: checkboxes
    id: scale
    attributes:
      label: "Scale (select all that apply)"
      description: "What was the scale of collaboration in this case?"
      options:
        - label: "Pair — 2 people"
        - label: "Small Team (3-10)"
        - label: "Organization (11-100)"
        - label: "Multi-Organization — networks of organizations"
        - label: "Community (100+) — large open communities"
    validations:
      required: true

  - type: checkboxes
    id: modality
    attributes:
      label: "Modality (select all that apply)"
      options:
        - label: "In-Person — co-located, face-to-face"
        - label: "Remote — fully online"
        - label: "Hybrid — mix of in-person and remote"
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Maturity Level
      description: "How well-documented is this case study?"
      options:
        - "Emerging — new or experimental, limited adoption"
        - "Established — proven track record, widely used"
        - "Well-Documented — extensive documentation, research, and community resources"
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: "Optional. One link per line. Format: type | URL | title"
      placeholder: |
        website | https://example.com | Official Website
        paper | https://doi.org/10.xxxx | Key Research Paper
        video | https://youtube.com/watch?v=... | Project Documentary

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: "Free-form keywords that describe this case study. Examples below."
      placeholder: "e.g., urban, governance, open-data, distributed-teams, citizen-engagement"

  - type: input
    id: related-entries
    attributes:
      label: Related CollabAtlas Entries (comma-separated IDs)
      description: "IDs of related entries. Browse the catalogue to find IDs (the URL slug is the ID)."
      placeholder: "e.g., participatory-design, action-research, miro"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: "Any other information that would help the editorial team."
