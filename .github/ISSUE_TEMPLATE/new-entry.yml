name: Propose New Entry
description: Suggest a new tool, method, framework, case study, dataset, or resource for the catalogue.
title: "[New Entry] "
labels: ["new-entry", "triage"]
body:
  - type: dropdown
    id: entry-type
    attributes:
      label: Entry Type
      options:
        - Tool
        - Method
        - Framework
        - Case Study
        - Dataset
        - Resource
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "e.g., Miro, Participatory Design, Activity Theory"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Brief description of the entry and why it belongs in CollabAtlas."
    validations:
      required: true

  - type: checkboxes
    id: domains
    attributes:
      label: Relevant Domains
      options:
        - label: Healthcare
        - label: Education
        - label: Urban Planning
        - label: Software Engineering
        - label: Design
        - label: Environmental Science
        - label: Social Sciences
        - label: Public Policy
        - label: Business
        - label: Arts & Culture
        - label: Disaster Response
        - label: Citizen Science
        - label: Manufacturing
        - label: Agriculture

  - type: textarea
    id: links
    attributes:
      label: External Links
      placeholder: |
        - Official website: https://...
        - Key paper: https://doi.org/...
        - Repository: https://github.com/...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: "Any other information that would help the editorial team evaluate this entry."
