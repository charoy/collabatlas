name: "Propose New Dataset"
description: "Suggest a dataset relevant to collaboration research for the CollabAtlas catalogue."
title: "[New Dataset] "
labels: ["new-entry", "dataset", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Suggest a Collaborative Dataset

        A **dataset** is a collection of data relevant to collaboration research
        (e.g., GitHub Archive, Wikipedia Edit History, Stack Overflow Survey).
        If you're unsure about taxonomy fields, pick your best guess — the editorial team will review.

  - type: input
    id: title
    attributes:
      label: Title
      description: "The name of the dataset."
      placeholder: "e.g., GitHub Archive, European Social Survey, OpenAlex Research Graph"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: "One-sentence summary (max 200 characters)."
      placeholder: "e.g., Complete public event timeline of all GitHub repositories, enabling analysis of open-source collaboration patterns."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: "2-5 sentences. What data does this contain? How is it relevant to collaboration research? What analyses does it enable?"
      placeholder: |
        Example: The GitHub Archive records all public GitHub events (pushes, pull requests,
        issues, comments) since 2011. Researchers use it to study open-source collaboration
        patterns, contributor networks, and the evolution of software projects at scale.
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: "URL where the dataset can be accessed."
      placeholder: "https://zenodo.org/record/..."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Hosting Platform
      options:
        - Zenodo
        - Kaggle
        - Figshare
        - Dataverse
        - Dryad
        - OSF
        - HuggingFace
        - Google BigQuery
        - ACM DL
        - Other
    validations:
      required: true

  - type: input
    id: platform-id
    attributes:
      label: Platform Identifier
      placeholder: "e.g., DOI, Kaggle slug"

  - type: input
    id: format
    attributes:
      label: Data Format
      placeholder: "e.g., CSV, JSON, Parquet, SQL dump"

  - type: input
    id: size
    attributes:
      label: Dataset Size
      placeholder: "e.g., 2.5 GB, 10,000 records"

  - type: input
    id: dataset-license
    attributes:
      label: License
      placeholder: "e.g., CC0, CC-BY-4.0, MIT"

  - type: input
    id: temporal-coverage
    attributes:
      label: Temporal Coverage
      placeholder: "e.g., 2015-2023"

  - type: checkboxes
    id: domains
    attributes:
      label: "Relevant Domains (select all that apply)"
      description: "Which fields does this dataset cover?"
      options:
        - label: "Healthcare — hospitals, clinical research, public health"
        - label: "Education — schools, universities, training"
        - label: "Urban Planning — cities, transport, housing"
        - label: "Software Engineering — development, DevOps"
        - label: "Design — UX, product design, architecture"
        - label: "Environmental Science — ecology, climate, conservation"
        - label: "Social Sciences — sociology, psychology, political science"
        - label: "Public Policy — government, civic engagement"
        - label: "Business — management, strategy, consulting"
        - label: "Arts & Culture — museums, performing arts"
        - label: "Disaster Response — emergency management, humanitarian aid"
        - label: "Citizen Science — volunteer research, community monitoring"
        - label: "Manufacturing — production, supply chain"
        - label: "Agriculture — farming, food systems"
        - label: "Publishing — journals, books, open access"
    validations:
      required: true

  - type: checkboxes
    id: collaboration-type
    attributes:
      label: "Collaboration Types (select all that apply)"
      description: "What kind of collaboration does this dataset relate to?"
      options:
        - label: "Co-Design — stakeholders jointly design solutions"
        - label: "Co-Creation — multiple parties create something new together"
        - label: "Co-Production — shared production across organizations"
        - label: "Participatory — actively involves end-users or communities"
        - label: "Distributed — geographically dispersed teams"
        - label: "Crowdsourcing — large-scale contributions from many people"
        - label: "Open Source — publicly available, community-developed"
        - label: "Interdisciplinary — across 2-3 related disciplines"
        - label: "Transdisciplinary — across many disciplines + non-academic actors"
        - label: "Community-Based — rooted in a specific community's needs"
    validations:
      required: true

  - type: checkboxes
    id: scale
    attributes:
      label: "Scale (select all that apply)"
      description: "What scale of collaboration does this dataset capture?"
      options:
        - label: "Pair — 2 people"
        - label: "Small Team (3-10)"
        - label: "Organization (11-100)"
        - label: "Multi-Organization — networks of organizations"
        - label: "Community (100+) — large open communities"
    validations:
      required: true

  - type: checkboxes
    id: modality
    attributes:
      label: "Modality (select all that apply)"
      options:
        - label: "In-Person — co-located, face-to-face"
        - label: "Remote — fully online"
        - label: "Hybrid — mix of in-person and remote"
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Maturity Level
      description: "How well-established is this dataset?"
      options:
        - "Emerging — new or experimental, limited adoption"
        - "Established — proven track record, widely used"
        - "Well-Documented — extensive documentation, research, and community resources"
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: "Optional. One link per line. Format: type | URL | title"
      placeholder: |
        website | https://example.com | Official Website
        paper | https://doi.org/10.xxxx | Research Paper Using This Dataset
        docs | https://docs.example.com | Data Dictionary

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: "Free-form keywords that describe this dataset. Examples below."
      placeholder: "e.g., open-data, network-analysis, text-mining, survey-data, bibliometrics"

  - type: input
    id: related-entries
    attributes:
      label: Related CollabAtlas Entries (comma-separated IDs)
      description: "IDs of related entries. Browse the catalogue to find IDs (the URL slug is the ID)."
      placeholder: "e.g., github-archive, stack-overflow-data-dump, openalex-research-graph"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: "Any other information that would help the editorial team."
