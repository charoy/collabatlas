name: "Propose New Resource"
description: "Suggest a book, article, course, or reference material for the CollabAtlas catalogue."
title: "[New Resource] "
labels: ["new-entry", "resource", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Suggest a Collaborative Resource

        A **resource** is a book, article, course, toolkit, or reference material useful
        for collaboration practitioners and researchers. If you're unsure about taxonomy
        fields, pick your best guess — the editorial team will review.

  - type: input
    id: title
    attributes:
      label: Title
      description: "The name of the resource."
      placeholder: "e.g., The Art of Gathering, Open Source Guide, Liberating Structures Toolkit"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: "One-sentence summary (max 200 characters)."
      placeholder: "e.g., A practical guide to transforming meetings and gatherings through purposeful design."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Full Description
      description: "2-5 sentences. What is this resource about? Who is it for? What makes it valuable for collaboration practitioners or researchers?"
      placeholder: |
        Example: The Art of Gathering by Priya Parker is a practical guide that challenges
        conventional approaches to meetings, conferences, and group events. It provides
        frameworks for designing purposeful gatherings that foster genuine connection
        and collaborative outcomes.
    validations:
      required: true

  - type: dropdown
    id: resource-type
    attributes:
      label: Resource Type
      options:
        - Article
        - Book
        - Course
        - Video
        - Tutorial
        - Report
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Authors (comma-separated)
      placeholder: "e.g., Jane Doe, John Smith"

  - type: input
    id: resource-year
    attributes:
      label: Publication Year
      placeholder: "e.g., 2024"

  - type: input
    id: doi
    attributes:
      label: DOI (if available)
      placeholder: "e.g., 10.1145/175222.175230"

  - type: dropdown
    id: access
    attributes:
      label: Access Level
      options:
        - Open
        - Restricted
        - Paid

  - type: checkboxes
    id: domains
    attributes:
      label: "Relevant Domains (select all that apply)"
      description: "Which fields does this resource cover?"
      options:
        - label: "Healthcare — hospitals, clinical research, public health"
        - label: "Education — schools, universities, training"
        - label: "Urban Planning — cities, transport, housing"
        - label: "Software Engineering — development, DevOps"
        - label: "Design — UX, product design, architecture"
        - label: "Environmental Science — ecology, climate, conservation"
        - label: "Social Sciences — sociology, psychology, political science"
        - label: "Public Policy — government, civic engagement"
        - label: "Business — management, strategy, consulting"
        - label: "Arts & Culture — museums, performing arts"
        - label: "Disaster Response — emergency management, humanitarian aid"
        - label: "Citizen Science — volunteer research, community monitoring"
        - label: "Manufacturing — production, supply chain"
        - label: "Agriculture — farming, food systems"
        - label: "Publishing — journals, books, open access"
    validations:
      required: true

  - type: checkboxes
    id: collaboration-type
    attributes:
      label: "Collaboration Types (select all that apply)"
      description: "What kind of collaboration does this resource address?"
      options:
        - label: "Co-Design — stakeholders jointly design solutions"
        - label: "Co-Creation — multiple parties create something new together"
        - label: "Co-Production — shared production across organizations"
        - label: "Participatory — actively involves end-users or communities"
        - label: "Distributed — geographically dispersed teams"
        - label: "Crowdsourcing — large-scale contributions from many people"
        - label: "Open Source — publicly available, community-developed"
        - label: "Interdisciplinary — across 2-3 related disciplines"
        - label: "Transdisciplinary — across many disciplines + non-academic actors"
        - label: "Community-Based — rooted in a specific community's needs"
    validations:
      required: true

  - type: checkboxes
    id: scale
    attributes:
      label: "Scale (select all that apply)"
      description: "What group sizes does this resource address?"
      options:
        - label: "Pair — 2 people"
        - label: "Small Team (3-10)"
        - label: "Organization (11-100)"
        - label: "Multi-Organization — networks of organizations"
        - label: "Community (100+) — large open communities"
    validations:
      required: true

  - type: checkboxes
    id: modality
    attributes:
      label: "Modality (select all that apply)"
      options:
        - label: "In-Person — co-located, face-to-face"
        - label: "Remote — fully online"
        - label: "Hybrid — mix of in-person and remote"
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: Maturity Level
      description: "How well-established is this resource?"
      options:
        - "Emerging — new or experimental, limited adoption"
        - "Established — proven track record, widely used"
        - "Well-Documented — extensive documentation, research, and community resources"
    validations:
      required: true

  - type: textarea
    id: external-links
    attributes:
      label: External Links
      description: "Optional. One link per line. Format: type | URL | title"
      placeholder: |
        website | https://example.com | Official Website
        paper | https://doi.org/10.xxxx | Related Research Paper
        video | https://youtube.com/watch?v=... | Author Talk

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: "Free-form keywords that describe this resource. Examples below."
      placeholder: "e.g., facilitation, open-access, toolkit, handbook, best-practices"

  - type: input
    id: related-entries
    attributes:
      label: Related CollabAtlas Entries (comma-separated IDs)
      description: "IDs of related entries. Browse the catalogue to find IDs (the URL slug is the ID)."
      placeholder: "e.g., open-source-guide, design-thinking, communities-of-practice"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: "Any other information that would help the editorial team."
